# mbp143-audio: PipeWire leaves a program's access to WirePlumber.
#
# WirePlumber hides the raw four-channel sink behind the speaker graph
# (hide-parent in wireplumber.conf.d/90-mbp143-audio.conf). With PipeWire's
# own default a program gets full access the moment it connects, before
# WirePlumber has hidden anything from it, so a program that links at once
# (pw-link, a patchbay) can reach the raw sink and play to the speakers
# without the graph's limiters and thermal protection. With "default" PipeWire
# gives a program on its usual socket no access until WirePlumber has decided,
# and WirePlumber grants it everything but the hidden sink. WirePlumber itself
# connects through the manager socket, which stays unrestricted.
#
# Unlike the WirePlumber rules this cannot key on the hardware: it applies on
# any machine the package is installed on. While WirePlumber is not running,
# a program that starts gets no access at all.
#
# PipeWire 1.4 and later merge this section into the access module's
# arguments (WirePlumber issue #1062).
#
# Installed by `make install`.

module.access.args = {
    access.socket = {
        pipewire-0 = "default"
        pipewire-0-manager = "unrestricted"
    }
}
